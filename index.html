<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐾 旅行规划Agent · AI智能行程助手</title>

    <!-- ==================== 外部依赖 CDN ==================== -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js">
    </script>

    <!-- ==================== 样式表 ==================== -->
    <style>
        :root {
            --bg: #f5f0eb;
            --card: #ffffff;
            --text: #2c2416;
            --text-light: #6b5e4a;
            --accent: #c47f3a;
            --accent-hover: #a8652d;
            --border: #e5ddd2;
            --tag-bg: #faf6f0;
            --tag-active: #c47f3a;
            --tag-active-text: #fff;
            --shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
            --radius: 14px;
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 16px 60px;
        }

        .app-header {
            text-align: center;
            padding: 28px 0 20px;
        }
        .app-header .logo {
            font-size: 42px;
            display: block;
            margin-bottom: 4px;
        }
        .app-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            color: #3d2b14;
        }
        .app-header .subtitle {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-top: 2px;
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 24px 28px;
            margin-bottom: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #3d2b14;
        }
        .card-title .icon {
            font-size: 1.3rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        @media (max-width: 560px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-light);
            letter-spacing: 0.02em;
        }
        .form-group input,
        .form-group select {
            padding: 11px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: var(--transition);
            background: #fefdfb;
            color: var(--text);
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(196, 127, 58, 0.08);
        }

        .preference-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 2px;
        }
        .pref-tag {
            padding: 7px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            border: 1.5px solid var(--border);
            background: var(--tag-bg);
            transition: var(--transition);
            user-select: none;
            font-weight: 500;
            color: #5c4a32;
        }
        .pref-tag:hover {
            border-color: var(--accent);
            background: #fdf5eb;
        }
        .pref-tag.active {
            background: var(--tag-active);
            color: var(--tag-active-text);
            border-color: var(--tag-active);
            font-weight: 600;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            letter-spacing: 0.03em;
            font-family: inherit;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            width: 100%;
            box-shadow: 0 4px 14px rgba(196, 127, 58, 0.3);
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 6px 20px rgba(196, 127, 58, 0.4);
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-pdf {
            background: #fff;
            color: #c47f3a;
            border: 2px solid #c47f3a;
            padding: 10px 22px;
            border-radius: 22px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .btn-pdf:hover {
            background: #fef9f3;
        }

        .loading-overlay {
            display: none;
            text-align: center;
            padding: 32px 0;
        }
        .loading-overlay.visible {
            display: block;
        }
        .spinner {
            width: 38px;
            height: 38px;
            border: 3.5px solid #e5ddd2;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .loading-text {
            font-size: 0.9rem;
            color: var(--text-light);
            letter-spacing: 0.04em;
        }

        .result-section {
            display: none;
        }
        .result-section.visible {
            display: block;
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }
        .result-header .badge {
            font-size: 0.8rem;
            background: #f0e8da;
            color: #6b5e4a;
            padding: 5px 12px;
            border-radius: 14px;
            font-weight: 500;
        }

        /* Markdown 渲染内容样式 */
        .markdown-body {
            line-height: 1.75;
            color: #2c2416;
        }
        .markdown-body h1 {
            font-size: 1.6rem;
            margin: 0 0 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e5ddd2;
            color: #3d2b14;
        }
        .markdown-body h2 {
            font-size: 1.2rem;
            margin: 22px 0 10px;
            color: #5c3d1e;
            padding-left: 10px;
            border-left: 3px solid #c47f3a;
        }
        .markdown-body h3 {
            font-size: 1.05rem;
            margin: 16px 0 8px;
            color: #4a3520;
        }
        .markdown-body p {
            margin: 6px 0;
        }
        .markdown-body ul,
        .markdown-body ol {
            padding-left: 22px;
            margin: 8px 0;
        }
        .markdown-body li {
            margin: 4px 0;
        }
        .markdown-body strong {
            color: #3d2b14;
        }
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 14px 0;
            font-size: 0.9rem;
        }
        .markdown-body table th,
        .markdown-body table td {
            border: 1px solid #e5ddd2;
            padding: 9px 12px;
            text-align: left;
        }
        .markdown-body table th {
            background: #faf6f0;
            font-weight: 700;
            color: #5c3d1e;
        }
        .markdown-body table tr:nth-child(even) {
            background: #fefdfb;
        }
        .markdown-body code {
            background: #f5f0eb;
            padding: 2px 7px;
            border-radius: 5px;
            font-size: 0.9em;
        }
        .markdown-body blockquote {
            border-left: 3px solid #c47f3a;
            padding: 8px 16px;
            margin: 12px 0;
            background: #fdf9f4;
            border-radius: 0 8px 8px 0;
            color: #5c4a32;
        }
        .markdown-body hr {
            border: none;
            border-top: 1px solid #e5ddd2;
            margin: 20px 0;
        }

        @media (max-width: 600px) {
            .card {
                padding: 16px 14px;
            }
            .app-header h1 {
                font-size: 1.4rem;
            }
            .markdown-body table {
                font-size: 0.78rem;
            }
            .markdown-body table th,
            .markdown-body table td {
                padding: 6px 8px;
            }
        }

        @media print {
            body {
                background: #fff;
            }
            .app-header,
            .form-card,
            .loading-overlay,
            .result-header .btn-pdf,
            .btn-primary,
            #input-section {
                display: none !important;
            }
            .result-section {
                display: block !important;
            }
            .card {
                box-shadow: none;
                border: none;
                padding: 0;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <span class="logo">🗺️</span>
            <h1>旅行规划 Agent</h1>
            <p class="subtitle">AI驱动 · 输入需求，一键生成专业方案</p>
        </header>

        <!-- 输入卡片 -->
        <div class="card form-card" id="input-section">
            <div class="card-title"><span class="icon">📋</span> 旅行信息</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="destination">📍 目的地</label>
                    <input type="text" id="destination" placeholder="例如：东京、巴黎、曼谷..." value="东京">
                </div>
                <div class="form-group">
                    <label for="budget">💰 预算（元）</label>
                    <input type="number" id="budget" placeholder="例如：8000" value="8000" min="500">
                </div>
                <div class="form-group">
                    <label for="days">📅 天数</label>
                    <input type="number" id="days" placeholder="例如：5" value="5" min="1" max="60">
                </div>
                <div class="form-group">
                    <label for="people">👥 人数</label>
                    <input type="number" id="people" placeholder="例如：2" value="2" min="1" max="50">
                </div>
            </div>
            <div class="form-group" style="margin-top:14px;">
                <label>❤️ 旅游偏好（可多选）</label>
                <div class="preference-tags" id="preference-tags">
                    <span class="pref-tag active" data-value="美食">🍜 美食</span>
                    <span class="pref-tag active" data-value="拍照">📷 拍照</span>
                    <span class="pref-tag" data-value="购物">🛍️ 购物</span>
                    <span class="pref-tag" data-value="历史文化">🏛️ 历史文化</span>
                    <span class="pref-tag" data-value="自然风光">🌿 自然风光</span>
                    <span class="pref-tag" data-value="冒险">🧗 冒险</span>
                    <span class="pref-tag" data-value="放松">🧘 放松</span>
                    <span class="pref-tag" data-value="夜生活">🌃 夜生活</span>
                    <span class="pref-tag" data-value="亲子">👶 亲子</span>
                    <span class="pref-tag" data-value="艺术">🎨 艺术</span>
                </div>
            </div>
            <button class="btn btn-primary" id="btn-plan" style="margin-top:18px;">
                ✨ 开始规划
            </button>
        </div>

        <!-- 加载状态 -->
        <div class="loading-overlay" id="loading-overlay">
            <div class="spinner"></div>
            <p class="loading-text">🤖 AI 正在为您精心规划旅行方案...</p>
        </div>

        <!-- 结果区域 -->
        <div class="result-section" id="result-section">
            <div class="result-header">
                <span class="badge">📝 AI 生成方案</span>
                <button class="btn btn-pdf" id="btn-download-pdf" title="下载PDF">
                    📥 下载 PDF
                </button>
            </div>
            <div class="card" id="result-card">
                <div class="markdown-body" id="markdown-content"></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ============================================================
            //  模块1: 配置 (Config) - API代理地址已更新
            // ============================================================
            const CONFIG = {
                api: {
                    // 使用您指定的API代理地址
                    endpoint: 'https://51ai-1.pages.dev/api/proxy',
                    apiKey: null, // 如果代理需要密钥，请在此填写
                    model: 'gpt-4o-mini',
                    timeout: 60000,
                },
                mockDelay: 1800,
                defaults: {
                    destination: '东京',
                    budget: 8000,
                    days: 5,
                    people: 2,
                    preferences: ['美食', '拍照'],
                },
                availablePreferences: [
                    '美食', '拍照', '购物', '历史文化', '自然风光',
                    '冒险', '放松', '夜生活', '亲子', '艺术'
                ],
            };

            // ============================================================
            //  模块2: DOM引用
            // ============================================================
            const DOM = {
                destination: document.getElementById('destination'),
                budget: document.getElementById('budget'),
                days: document.getElementById('days'),
                people: document.getElementById('people'),
                preferenceTags: document.getElementById('preference-tags'),
                btnPlan: document.getElementById('btn-plan'),
                loadingOverlay: document.getElementById('loading-overlay'),
                resultSection: document.getElementById('result-section'),
                markdownContent: document.getElementById('markdown-content'),
                btnDownloadPdf: document.getElementById('btn-download-pdf'),
                resultCard: document.getElementById('result-card'),
            };

            // ============================================================
            //  模块3: 偏好标签交互
            // ============================================================
            function initPreferenceTags() {
                const tags = DOM.preferenceTags.querySelectorAll('.pref-tag');
                tags.forEach(tag => {
                    tag.addEventListener('click', function() {
                        this.classList.toggle('active');
                    });
                });
            }

            function getSelectedPreferences() {
                const tags = DOM.preferenceTags.querySelectorAll('.pref-tag.active');
                return Array.from(tags).map(t => t.getAttribute('data-value'));
            }

            // ============================================================
            //  模块4: 表单数据收集
            // ============================================================
            function collectFormData() {
                const destination = DOM.destination.value.trim() || CONFIG.defaults.destination;
                const budget = parseInt(DOM.budget.value) || CONFIG.defaults.budget;
                const days = parseInt(DOM.days.value) || CONFIG.defaults.days;
                const people = parseInt(DOM.people.value) || CONFIG.defaults.people;
                const preferences = getSelectedPreferences();
                const finalPreferences = preferences.length > 0 ?
                    preferences :
                    CONFIG.defaults.preferences;

                return {
                    destination,
                    budget: Math.max(budget, 100),
                    days: Math.min(Math.max(days, 1), 60),
                    people: Math.min(Math.max(people, 1), 50),
                    preferences: finalPreferences,
                };
            }

            // ============================================================
            //  模块5: AI调用模块 - 已接入API代理
            // ============================================================
            function buildPrompt(data) {
                const prefStr = data.preferences.join('、');
                return `你是一位资深旅行规划师。请根据下面信息生成完整旅行方案。

        目的地：${data.destination}
        天数：${data.days}天
        预算：${data.budget}元
        人数：${data.people}人
        偏好：${prefStr}。

        请输出：

        ① 每天时间安排（从早到晚详细行程）
        ② 推荐景点（含简短介绍和预估费用）
        ③ 推荐餐厅（含人均消费和特色菜品）
        ④ 每天预算明细（住宿/餐饮/交通/门票/其他）
        ⑤ 交通方式（市内交通 + 城际交通建议）
        ⑥ 注意事项（安全、礼仪、支付等）
        ⑦ 必备物品清单
        ⑧ 最终生成一份适合打印的旅行清单汇总

        全部使用Markdown格式输出，要求结构清晰、排版美观、信息实用。
        如果预算偏紧，请诚实说明并给出经济型替代建议。
        表格部分请使用Markdown表格语法。`;
            }

            /**
             * 调用真实API代理
             */
            async function callRealAI(data) {
                const prompt = buildPrompt(data);

                // 构建请求体（兼容OpenAI格式，代理会自动转发）
                const requestBody = {
                    model: CONFIG.api.model,
                    messages: [
                        {
                            role: 'system',
                            content: '你是一位资深旅行规划师，擅长制定详细实用的旅行方案。请始终使用Markdown格式回复，包含表格和清晰的层次结构。'
                        },
                        { role: 'user', content: prompt },
                    ],
                    temperature: 0.7,
                    max_tokens: 4096,
                };

                // 如果配置了apiKey，添加到请求头
                const headers = {
                    'Content-Type': 'application/json',
                };
                if (CONFIG.api.apiKey) {
                    headers['Authorization'] = `Bearer ${CONFIG.api.apiKey}`;
                }

                const response = await fetch(CONFIG.api.endpoint, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(requestBody),
                    signal: AbortSignal.timeout(CONFIG.api.timeout),
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`API请求失败 (${response.status}): ${errorText.slice(0, 200)}`);
                }

                const json = await response.json();

                // 兼容多种API响应格式
                const content = json.choices?.[0]?.message?.content ||
                    json.content ||
                    json.data?.content ||
                    json.message?.content ||
                    '';

                if (!content) {
                    console.error('API响应结构:', json);
                    throw new Error(
                        'AI响应为空，请检查API代理是否正常返回数据。响应结构: ' +
                        JSON.stringify(json).slice(0, 300));
                }

                return content;
            }

            /**
             * 模拟AI响应 (当API不可用时的fallback)
             */
            function mockAIResponse(data) {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        resolve(generateMockMarkdown(data));
                    }, CONFIG.mockDelay);
                });
            }

            /**
             * 统一的AI调用入口
             * 优先使用真实API，失败时自动降级到模拟数据
             */
            async function fetchTravelPlan(data) {
                try {
                    console.log('🚀 正在调用AI代理:', CONFIG.api.endpoint);
                    const result = await callRealAI(data);
                    console.log('✅ AI响应成功');
                    return result;
                } catch (error) {
                    console.warn('⚠️ API调用失败，降级使用模拟数据:', error.message);
                    // 降级到模拟数据
                    return await mockAIResponse(data);
                }
            }

            // ============================================================
            //  模块6: Markdown渲染
            // ============================================================
            function renderMarkdown(markdownText) {
                marked.setOptions({
                    breaks: true,
                    gfm: true,
                });
                const html = marked.parse(markdownText);
                DOM.markdownContent.innerHTML = html;
            }

            // ============================================================
            //  模块7: PDF下载
            // ============================================================
            function downloadPDF() {
                const element = DOM.resultCard;
                const destination = DOM.destination.value.trim() || '旅行方案';
                const filename = `${destination}_旅行方案_${new Date().toISOString().slice(0,10)}.pdf`;

                const opt = {
                    margin: [8, 8, 8, 8],
                    filename: filename,
                    image: { type: 'jpeg', quality: 0.95 },
                    html2canvas: {
                        scale: 2,
                        useCORS: true,
                        letterRendering: true,
                    },
                    jsPDF: {
                        unit: 'mm',
                        format: 'a4',
                        orientation: 'portrait',
                    },
                    pagebreak: { mode: ['avoid-all', 'css', 'legacy'] },
                };

                const btn = DOM.btnDownloadPdf;
                const originalText = btn.textContent;
                btn.textContent = '⏳ 生成中...';
                btn.disabled = true;

                html2pdf().set(opt).from(element).save().then(() => {
                    btn.textContent = originalText;
                    btn.disabled = false;
                }).catch((err) => {
                    console.error('PDF生成失败:', err);
                    btn.textContent = originalText;
                    btn.disabled = false;
                    alert('PDF生成失败，请重试。');
                });
            }

            // ============================================================
            //  模块8: UI状态管理
            // ============================================================
            function showLoading() {
                DOM.loadingOverlay.classList.add('visible');
                DOM.resultSection.classList.remove('visible');
                DOM.btnPlan.disabled = true;
                DOM.btnPlan.textContent = '⏳ 规划中...';
            }

            function hideLoading() {
                DOM.loadingOverlay.classList.remove('visible');
                DOM.btnPlan.disabled = false;
                DOM.btnPlan.textContent = '✨ 开始规划';
            }

            function showResult() {
                DOM.resultSection.classList.add('visible');
                DOM.resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            // ============================================================
            //  模块9: 主控制器
            // ============================================================
            async function handlePlanClick() {
                const data = collectFormData();

                if (!data.destination) {
                    alert('请输入目的地');
                    DOM.destination.focus();
                    return;
                }
                if (data.budget < 100) {
                    alert('预算至少需要100元');
                    DOM.budget.focus();
                    return;
                }

                showLoading();

                try {
                    const markdownText = await fetchTravelPlan(data);
                    renderMarkdown(markdownText);
                    hideLoading();
                    showResult();
                } catch (error) {
                    console.error('获取旅行方案失败:', error);
                    hideLoading();
                    alert('获取旅行方案失败: ' + (error.message || '未知错误，请重试'));
                }
            }

            // ============================================================
            //  模块10: 模拟Markdown数据生成器 (仅作为API不可用时的fallback)
            // ============================================================
            function generateMockMarkdown(data) {
                const dest = data.destination;
                const days = data.days;
                const budget = data.budget;
                const people = data.people;
                const pref = data.preferences.join('、');
                const perDayBudget = Math.floor(budget / days / people);
                const isBudgetTight = perDayBudget < 600;
                const hasFood = data.preferences.includes('美食');
                const hasPhoto = data.preferences.includes('拍照');
                const hasShopping = data.preferences.includes('购物');

                const attractionsMap = {
                    '东京': [
                        { name: '浅草寺', fee: '免费', desc: '东京最古老的寺庙，雷门大灯笼是标志性打卡点' },
                        { name: '明治神宫', fee: '免费', desc: '位于原宿的宁静神社，参天大树环绕' },
                        { name: '涩谷SKY', fee: '约120元', desc: '360度露天观景台，俯瞰东京全景' },
                        { name: 'teamLab Borderless', fee: '约180元', desc: '沉浸式数字艺术馆，拍照圣地' },
                        { name: '筑地场外市场', fee: '免费', desc: '美食天堂，新鲜海鲜和街头小吃' },
                        { name: '银座', fee: '免费', desc: '高端购物区，适合拍照和逛街' },
                    ],
                    '巴黎': [
                        { name: '埃菲尔铁塔', fee: '约180元', desc: '巴黎地标，登顶俯瞰城市' },
                        { name: '卢浮宫', fee: '约120元', desc: '世界最大博物馆，蒙娜丽莎之家' },
                    ],
                    '曼谷': [
                        { name: '大皇宫', fee: '约100元', desc: '泰国王室宫殿，金碧辉煌' },
                        { name: '考山路', fee: '免费', desc: '背包客天堂，美食云集' },
                    ],
                };

                const attractions = attractionsMap[dest] || attractionsMap['东京'];
                const selectedAttractions = attractions.slice(0, Math.min(attractions.length, 6));

                let dailySchedule = '';
                const dayNames = ['第一天', '第二天', '第三天', '第四天', '第五天', '第六天', '第七天'];
                for (let i = 0; i < Math.min(days, 7); i++) {
                    const attr = selectedAttractions[i % selectedAttractions.length];
                    const attr2 = selectedAttractions[(i + 1) % selectedAttractions.length];
                    dailySchedule += `
        ### ${dayNames[i] || `第${i+1}天`}

        | 时间 | 活动 | 详情 |
        |------|------|------|
        | 08:00-09:00 | 🌅 早餐 | 酒店早餐或附近咖啡馆 |
        | 09:00-12:00 | 🏛️ 景点游览 | **${attr.name}** — ${attr.desc}（门票：${attr.fee}） |
        | 12:00-13:30 | 🍽️ 午餐 | 当地特色餐厅（人均约${50+Math.floor(Math.random()*80)}元） |
        | 13:30-17:00 | 📷 探索时光 | **${attr2.name}** — ${attr2.desc}（门票：${attr2.fee}） |
        | 17:00-19:00 | 🛍️ 自由活动 | ${hasShopping ? '逛街购物，发现隐藏小店' : '漫步街头，感受当地氛围'} |
        | 19:00-21:00 | 🍷 晚餐 | ${hasFood ? '精选餐厅，品尝地道美味（人均约80-150元）' : '舒适餐厅用餐'} |
        | 21:00以后 | 🌙 夜间 | ${hasPhoto ? '拍摄夜景，记录美好瞬间' : '回酒店休息或轻酌一杯'} |

        **当日预估花费：** 约${perDayBudget}元/人
        `;
                }

                const budgetWarning = isBudgetTight ? `
        > ⚠️ **预算提示：** 您的预算（${budget}元/${people}人/${days}天）较为紧张，人均每天约${perDayBudget}元。
        > 建议选择经济型住宿、利用公共交通、选择免费景点和街头美食以控制开支。
        ` : '';

                const restaurants = hasFood ? `
        | 餐厅名称 | 类型 | 人均消费 | 推荐菜品 | 备注 |
        |----------|------|----------|----------|------|
        | 一兰拉面 | 日式拉面 | 约60元 | 豚骨拉面 | 24小时营业 |
        | 筑地寿司清 | 寿司 | 约150元 | 手握寿司套餐 | 新鲜食材 |
        | 鸟贵族 | 烧鸟 | 约80元 | 烤鸡串拼盘 | 性价比高 |
        | HARBS | 甜品咖啡 | 约90元 | 水果千层蛋糕 | 拍照好看 |
        ` : `
        | 餐厅名称 | 类型 | 人均消费 | 推荐菜品 |
        |----------|------|----------|----------|
        | 当地热门餐厅A | 本地菜 | 约60元 | 招牌套餐 |
        | 当地热门餐厅B | 融合菜 | 约100元 | 主厨推荐 |
        `;

                const markdown = `
        # 🗺️ ${dest} ${days}天旅行方案

        > 📋 **方案概要：** ${people}人同行 · 总预算${budget}元 · 偏好：${pref}
        > 📅 生成日期：${new Date().toLocaleDateString('zh-CN')}
        > ⚠️ *此方案由本地模拟生成（API调用失败时的备用方案）*

        ${budgetWarning}

        ---

        ## 📅 ① 每日时间安排

        ${dailySchedule}

        ---

        ## 🏛️ ② 推荐景点

        | 景点名称 | 门票费用 | 推荐理由 | 适合偏好 |
        |----------|----------|----------|----------|
        ${selectedAttractions.map(a => `| **${a.name}** | ${a.fee} | ${a.desc} | ${pref} |`).join('\n')}

        ---

        ## 🍽️ ③ 推荐餐厅

        ${restaurants}

        ---

        ## 💰 ④ 每天预算明细

        | 类别 | 每天预估（/人） | ${days}天总计（/人） | 备注 |
        |------|:----------:|:----------:|------|
        | 🏨 住宿 | ${Math.floor(perDayBudget*0.35)}元 | ${Math.floor(perDayBudget*0.35*days)}元 | 经济型酒店/民宿 |
        | 🍽️ 餐饮 | ${Math.floor(perDayBudget*0.30)}元 | ${Math.floor(perDayBudget*0.30*days)}元 | 含三餐和小吃 |
        | 🚇 交通 | ${Math.floor(perDayBudget*0.15)}元 | ${Math.floor(perDayBudget*0.15*days)}元 | 公共交通为主 |
        | 🎫 门票 | ${Math.floor(perDayBudget*0.12)}元 | ${Math.floor(perDayBudget*0.12*days)}元 | 景点门票 |
        | 🛍️ 其他 | ${Math.floor(perDayBudget*0.08)}元 | ${Math.floor(perDayBudget*0.08*days)}元 | 购物、零食等 |
        | **合计** | **${perDayBudget}元** | **${perDayBudget*days}元** | — |

        ---

        ## 🚇 ⑤ 交通方式

        - **到达${dest}：** 建议提前预订特价机票
        - **市内交通：** 地铁/公交为主，购买交通卡或一日券

        ---

        ## ⚠️ ⑥ 注意事项

        1. **签证：** 提前办理签证
        2. **支付：** 准备适量当地货币现金
        3. **网络：** 提前购买当地SIM卡或租用随身WiFi
        4. **安全：** 保管好随身物品，购买旅行保险

        ---

        ## 🎒 ⑦ 必备物品清单

        | 类别 | 物品 | 备注 |
        |------|------|------|
        | 📄 证件 | 护照、签证、身份证 | 复印备份 |
        | 💳 财务 | 现金、信用卡 | 分散存放 |
        | 📱 电子 | 手机、充电器、充电宝 | — |
        | 💊 药品 | 感冒药、肠胃药 | 个人常用药 |

        ---

        ## 📝 ⑧ 旅行清单汇总

        - [ ] 护照/签证
        - [ ] 机票预订确认
        - [ ] 酒店预订确认
        - [ ] 旅行保险
        - [ ] 当地货币兑换
        - [ ] 下载离线地图
        - [ ] 行程单打印

        ---

        > 🎉 **祝旅途愉快！** 此方案为本地备用方案，如需更精准的AI规划，请检查API代理配置。
        `;

                return markdown;
            }

            // ============================================================
            //  模块11: 事件绑定与初始化
            // ============================================================
            function bindEvents() {
                DOM.btnPlan.addEventListener('click', handlePlanClick);
                DOM.btnDownloadPdf.addEventListener('click', downloadPDF);

                document.addEventListener('keydown', function(e) {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                        e.preventDefault();
                        handlePlanClick();
                    }
                });

                [DOM.destination, DOM.budget, DOM.days, DOM.people].forEach(input => {
                    input.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            handlePlanClick();
                        }
                    });
                });
            }

            function init() {
                initPreferenceTags();
                bindEvents();
                console.log('🗺️ 旅行规划Agent已就绪');
                console.log('   API代理地址:', CONFIG.api.endpoint);
                console.log('   - 点击"开始规划"调用真实AI');
                console.log('   - 若API不可用，自动降级使用模拟数据');
                console.log('   - 快捷键：Ctrl+Enter 快速规划');
            }

            init();

        })();
    </script>
